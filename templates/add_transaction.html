<!DOCTYPE html> <!-- khai báo tài liệu HTML5 -->
<html lang="vi"> <!-- bắt đầu trang web, ngôn ngữ tiếng Việt -->

<head> <!-- phần khai báo thông tin trang web -->

    <meta charset="UTF-8"> <!-- hỗ trợ hiển thị tiếng Việt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- tối ưu hiển thị trên điện thoại -->

    <title>Thêm giao dịch</title> <!-- tiêu đề trang web -->


    <style> 

        body{
            font-family: Arial; /* thiết lập font chữ */
            background: #f4f4f4;/* màu nền */
        }

        .container{
            width: 400px; /* chiều rộng khung */
            margin: 50px auto;/* căn giữa */
            background: white;/* màu nền */
            padding: 20px;/* khoảng cách bên trong */
            border-radius: 10px; /* bo góc */
        }

        input, select{
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button{
            width: 100%;
            padding: 10px;
            background: rgb(208, 136, 148);
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover{
            background: rgb(49, 164, 187);
        }

    </style>

</head>
<body> <!-- bắt đầu phần nội dung -->

    <div class="container"> <!-- tạo khung chứa form -->


<form method="POST" enctype="multipart/form-data"> <!-- tạo form gửi dữ liệu bằng POST -->


        <label>Thêm giao dịch</label> <!-- tiêu đề -->
        <input type="text" name="title" required> 

      
            <label>Số tiền</label> <!-- nhãn số tiền -->
            <div class="money-box"></div> <!-- vùng hiển thị tiền -->
            <input type="number" name="amount" min="0" step="0.01" placeholder="Nhập số tiền" required> <!-- nhập số tiền -->

            <label>Danh mục</label> <!-- nhập số tiền -->
            <select name="category" required> <!-- danh sách danh mục -->
        {% for c in categories %} <!-- duyệt danh sách categories -->
                <option value="{{ c }}">{{ c }}</option> <!-- duyệt danh sách categories -->
        {% endfor %} <!-- duyệt danh sách categories -->
             </select>

            <label>Ngày giao dịch</label><!-- nhãn ngày giao dịch -->
            <input type="date" name="date" required> <!-- chọn ngày -->


            <label>Loại giao dịch</label><!-- nhãn loại giao dịch -->


            <select name="type" required> <!-- chọn loại giao dịch -->

                <option value="income">Thu nhập</option> <!-- giao dịch thu -->

                <option value="expense">Chi tiêu</option><!-- giao dịch chi -->

            </select>

            <button type="submit">Lưu giao dịch</button><!-- nút gửi form -->

        </form>

    </div>

</body>
</html>
