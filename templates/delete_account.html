{% extends 'base.html' %} <!-- kế thừa giao diện từ base.html -->

{% block content %} <!-- bắt đầu nội dung -->

<div class="container mt-5"> <!-- tạo vùng chứa -->

    <div class="card shadow border-danger"> <!-- tạo khung cảnh báo -->

        <div class="card-header bg-danger text-white">
            Xóa tài khoản
        </div> <!-- tiêu đề -->

        <div class="card-body"> <!-- nội dung -->

            <div class="alert alert-warning"> <!-- hiển thị cảnh báo -->

                <strong>Cảnh báo!</strong>

                Hành động này sẽ xóa:

                <ul class="mb-0 mt-2"> <!-- danh sách dữ liệu bị xóa -->

                    <li>Tài khoản của bạn</li>

                    <li>Toàn bộ giao dịch</li>

                    <li>Dữ liệu tài chính</li>

                </ul>

                <strong>Dữ liệu không thể khôi phục.</strong>

            </div>

            <form method="POST"> <!-- tạo form gửi yêu cầu xóa -->

                <div class="mb-3">

                    <label class="form-label">
                        Nhập lại mật khẩu
                    </label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>
                    <!-- nhập mật khẩu xác nhận -->

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Nhập DELETE để xác nhận
                    </label>

                    <input
                        type="text"
                        name="confirm_text"
                        class="form-control"
                        required>
                    <!-- nhập DELETE để xác nhận -->

                </div>

                <button
                    type="submit"
                    class="btn btn-danger">

                    Xóa tài khoản

                </button>
                <!-- gửi yêu cầu xóa -->

                <a href="{{ url_for('transaction.dashboard') }}"
                   class="btn btn-secondary">

                    Hủy

                </a>
                <!-- quay về dashboard -->

            </form>

        </div>

    </div>

</div>

{% endblock %} <!-- kết thúc nội dung -->
