{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            Đổi mật khẩu
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label>Mật khẩu cũ</label>

                    <input
                    type="password"
                    name="old_password"
                    class="form-control"
                    required>

                </div>

                <div class="mb-3">

                    <label>Mật khẩu mới</label>

                    <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    required>

                </div>

                <div class="mb-3">

                    <label>Nhập lại mật khẩu mới</label>

                    <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required>

                </div>

                <button class="btn btn-primary">

                    Đổi mật khẩu

                </button>

                <a href="{{ url_for('transaction.dashboard') }}"
                   class="btn btn-secondary">

                    Hủy

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
