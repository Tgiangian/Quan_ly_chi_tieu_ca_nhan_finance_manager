{% extends 'base.html' %} <!-- kế thừa giao diện từ base.html -->

{% block content %} <!-- bắt đầu phần nội dung -->

<div class="container mt-5"> <!-- tạo vùng chứa -->

    <div class="card shadow"> <!-- tạo khung card -->

        <div class="card-header bg-primary text-white">
            Đổi mật khẩu
        </div> <!-- tiêu đề card -->

        <div class="card-body"> <!-- phần nội dung card -->

            <form method="POST"> <!-- tạo form gửi dữ liệu bằng POST -->

                <div class="mb-3"> <!-- tạo khoảng cách -->

                    <label>Mật khẩu cũ</label> <!-- nhãn -->

                    <input
                    type="password"
                    name="old_password"
                    class="form-control"
                    required> <!-- ô nhập mật khẩu cũ -->

                </div>

                <div class="mb-3">

                    <label>Mật khẩu mới</label> <!-- nhãn -->

                    <input
                    type="password"
                    name="new_password"
                    class="form-control"
                    required> <!-- ô nhập mật khẩu mới -->

                </div>

                <div class="mb-3">

                    <label>Nhập lại mật khẩu mới</label> <!-- nhãn -->

                    <input
                    type="password"
                    name="confirm_password"
                    class="form-control"
                    required> <!-- ô xác nhận mật khẩu -->

                </div>

                <button class="btn btn-primary">

                    Đổi mật khẩu

                </button> <!-- nút gửi yêu cầu đổi mật khẩu -->

                <a href="{{ url_for('transaction.dashboard') }}"
                   class="btn btn-secondary">

                    Hủy

                </a> <!-- quay về dashboard -->

            </form>

        </div>

    </div>

</div>

{% endblock %} <!-- kết thúc phần nội dung -->
