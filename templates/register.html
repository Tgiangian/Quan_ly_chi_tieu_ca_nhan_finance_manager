<!DOCTYPE html> <!-- khai báo tài liệu HTML5 -->

<html> <!-- bắt đầu trang web -->

<head>

    <title>Register</title>
    <!-- tiêu đề trang -->

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <!-- thư viện Bootstrap -->

</head>

<body class="bg-light">
<!-- tạo nền màu sáng -->

<div class="container">
<!-- tạo vùng chứa -->

    <div class="row justify-content-center">
    <!-- căn giữa -->

        <div class="col-md-5">
        <!-- chiếm 5 cột Bootstrap -->

            <div class="card shadow p-4">
            <!-- tạo khung đăng ký -->

                <h2 class="text-center mb-4">

                    Đăng ký tài khoản

                </h2>
                <!-- tiêu đề -->

                <!-- Flash message -->

                {% with messages = get_flashed_messages() %}
                <!-- lấy thông báo từ Flask -->

                    {% if messages %}

                        {% for message in messages %}

                            <div class="alert alert-warning">

                                {{ message }}

                            </div>
                            <!-- hiển thị thông báo -->

                        {% endfor %}

                    {% endif %}

                {% endwith %}

                <form method="POST">
                <!-- tạo form gửi dữ liệu -->

                    <!-- Username -->

                    <input
                    type="text"
                    name="username"
                    class="form-control mb-3"
                    placeholder="Username"
                    required>
                    <!-- nhập username -->

                    <!-- Email -->

                    <input
                    type="email"
                    name="email"
                    class="form-control mb-3"
                    placeholder="Email"
                    required>
                    <!-- nhập email -->

                    <!-- Password -->

                    <input
                    type="password"
                    name="password"
                    class="form-control mb-3"
                    placeholder="Password"
                    required>
                    <!-- nhập mật khẩu -->

                    <!-- Confirm Password -->

                    <input
                    type="password"
                    name="confirm_password"
                    class="form-control mb-3"
                    placeholder="Nhập lại password"
                    required>
                    <!-- nhập lại mật khẩu -->

                    <!-- Button -->

                    <button class="btn btn-success w-100">

                        Đăng ký

                    </button>
                    <!-- gửi dữ liệu đăng ký -->

                </form>

                <div class="text-center mt-3">

                    Đã có tài khoản?

                    <a href="{{ url_for('auth.login') }}">

                        Đăng nhập

                    </a>
                    <!-- chuyển sang trang đăng nhập -->

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
