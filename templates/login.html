<!DOCTYPE html> <!-- khai báo tài liệu HTML5 -->

<html lang="vi"> <!-- bắt đầu trang web -->

<head>

    <meta charset="UTF-8">
    <!-- hỗ trợ tiếng Việt -->

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <!-- tự động co giãn trên điện thoại -->

    <title>Finance Manager - Login</title>
    <!-- tiêu đề trang -->

    <!-- Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
    <!-- thư viện Bootstrap -->

    <!-- Bootstrap Icons -->
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- thư viện icon -->

</head>

<head>

     <style>
        /* CSS thiết kế giao diện */

        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
        }

        .login-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 55px;
            color: #8ca4ee;
        }

        .btn-primary {
            background: #65d5eb;
            border: none;
            border-radius: 12px;
        }

        .btn-primary:hover {
            background: #6944d9;
        }
    </style>

</head>

<body class="bg-light">

<div class="container">
<!-- tạo vùng chứa -->

    <div class="row justify-content-center align-items-center vh-100">
    <!-- căn giữa màn hình -->

        <div class="col-md-5">
        <!-- chiếm 5 cột bootstrap -->

            <div class="card shadow-lg border-0 rounded-4">
            <!-- tạo khung đăng nhập -->

                <div class="card-body p-5">

                    <!-- Logo -->

                    <div class="text-center mb-4">

                        <i class="bi bi-wallet2 text-primary"
                        style="font-size: 60px;"></i>
                        <!-- icon ví tiền -->

                        <h2 class="mt-3 fw-bold">

                            Finance Manager

                        </h2>

                        <p class="text-muted">

                            Đăng nhập để quản lý tài chính

                        </p>

                    </div>

                    <!-- Flash Message -->

                    {% with messages = get_flashed_messages() %}
                    <!-- lấy thông báo -->

                        {% if messages %}

                            {% for message in messages %}

                                <div class="alert alert-warning">

                                    {{ message }}

                                </div>
                                <!-- hiển thị thông báo -->

                            {% endfor %}

                        {% endif %}

                    {% endwith %}

                    <!-- Form -->

                    <form method="POST">
                    <!-- gửi dữ liệu đăng nhập -->

                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">

                                Username

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-person"></i>

                                </span>

                                <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Nhập username"
                                required>
                                <!-- nhập username -->

                            </div>

                        </div>

                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock"></i>

                                </span>

                                <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                placeholder="Nhập password"
                                required>
                                <!-- nhập mật khẩu -->

                                <button
                                type="button"
                                class="btn btn-outline-secondary"
                                onclick="togglePassword()">

                                    <i class="bi bi-eye"></i>

                                </button>
                                <!-- hiện/ẩn mật khẩu -->

                            </div>

                        </div>

                        <!-- Remember me -->

                        <div class="form-check mb-3">

                            <input
                            class="form-check-input"
                            type="checkbox">

                            <label class="form-check-label">

                                Remember me

                            </label>

                        </div>
                        <!-- ghi nhớ đăng nhập -->

                        <!-- Login button -->

                        <button
                        class="btn btn-primary w-100 py-2">

                            Đăng nhập

                        </button>
                        <!-- gửi form -->

                    </form>

                    <!-- Register -->

                    <div class="text-center mt-4">

                        Chưa có tài khoản?

                        <a href="{{ url_for('auth.register') }}"
                        class="text-decoration-none">

                            Đăng ký ngay

                        </a>
                        <!-- chuyển sang trang đăng ký -->

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- JS Show Password -->

<script>

function togglePassword() {
    // hàm hiện/ẩn mật khẩu

    const passwordInput =
        document.getElementById("password");

    if (passwordInput.type === "password") {

        passwordInput.type = "text";

    } else {

        passwordInput.type = "password";

    }
}

</script>

</body>

</html>
